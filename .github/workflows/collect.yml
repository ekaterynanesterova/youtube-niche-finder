name: Сбор данных

on:
  workflow_dispatch:
    inputs:
      searchBudget:
        description: 'Сколько search-запросов сделать (0 = только опрос известных каналов, без разведки)'
        default: '40'
      unitBudget:
        description: 'Потолок квоты на прогон (из 10000 в сутки)'
        default: '9000'
      onlySeeds:
        description: 'Прогнать только эти темы, через запятую (пусто = обычная ротация)'
        default: ''
      metricsOnly:
        description: 'Только пересчитать метрики и пересобрать страницу, без похода в YouTube'
        type: boolean
        default: false
      checkRemote:
        description: 'Только проверить связь с Supabase и выйти. Квоту не тратит, базу не трогает'
        type: boolean
        default: false
      lensTest:
        description: 'Замер: что даёт слово documentary в запросе. Тратит ~1200 юнитов, базу не меняет'
        type: boolean
        default: false
  schedule:
    # 07:30 UTC — через полчаса после летнего обнуления квоты Google.
    #
    # Выключалось 15 сентября 2026, когда аккаунт заблокировали за то, что
    # каждый ночной прогон дописывал в историю около ста мегабайт. Причина
    # устранена: база уехала из git, страница сжата, а шаг «Проверка веса»
    # ниже физически не даст этому вернуться.
    - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Накопленная база живёт в кэше, а не в репозитории.
      #
      # Раньше она лежала в git, и каждый ночной прогон дописывал в историю
      # новый снимок videos.json целиком — около ста мегабайт в сутки. За это
      # аккаунт и заблокировали: со стороны GitHub репозиторий в роли базы
      # данных и Actions в роли сборщика данных выглядят ровно так, как
      # выглядит злоупотребление, и их правила запрещают и то, и другое.
      #
      # Ключ уникален для прогона, поэтому запись всегда создаёт новую запись
      # кэша, а restore-keys подбирает самую свежую из прошлых. Так кэш
      # обновляется, а не залипает на первой версии.
      - name: Достать накопленную базу
        id: db
        if: github.event.inputs.checkRemote != 'true'
        uses: actions/cache/restore@v4
        with:
          path: data
          key: niche-db-${{ github.run_id }}
          restore-keys: niche-db-

      # Страховка на случай, когда кэша нет: первый прогон после переезда, или
      # кэш выселили за давностью. База лежит в истории репозитория — до
      # коммита f9024c7 она коммитилась вместе с кодом. Оттуда её и достаём.
      #
      # Формат там старый, несжатый. Это нормально: store.js читает обе версии
      # и при первой же записи перекладывает базу в новую. Терять двадцать
      # пять дней срезов только потому, что кэш протух, нельзя — прирост
      # просмотров считается именно по ним, и заново он не восстанавливается
      # ничем, API историю не отдаёт.
      #
      # Чего этот путь НЕ вернёт: три недельных опорных среза за август, они
      # уцелели только потому, что их вытащили из более старых коммитов
      # поимённо. Основной запасной путь — артефакт прогона, он содержит
      # bases.json.gz целиком. История репозитория — последний рубеж.
      - name: Поднять базу из истории, если кэша нет
        if: steps.db.outputs.cache-matched-key == '' && github.event.inputs.checkRemote != 'true'
        run: |
          echo "Кэша нет — достаю последнюю базу из истории репозитория"
          git fetch --depth=1 origin f9024c7d31e6951c9b196946259ab027c8efb18f
          git checkout f9024c7d31e6951c9b196946259ab027c8efb18f -- data
          git reset -q data
          du -sh data

      - name: Проверка счётной части
        run: node src/selftest.js

      - name: Прогон
        id: run
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Пока эти два секрета не заданы, база работает по локальным файлам
          # и уезжает в кэш, как сейчас. Как только заданы — источник правды
          # переезжает в Supabase, а кэш остаётся тёплым стартом на случай,
          # если хранилище окажется недоступно.
          #
          # Первый прогон с Supabase бутстрапится сам: скачивать оттуда нечего,
          # база остаётся та, что пришла из кэша, и в конце прогона уезжает
          # в хранилище.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: ${{ vars.SUPABASE_BUCKET || 'niche-db' }}
          SEARCH_BUDGET: ${{ github.event.inputs.searchBudget || '40' }}
          UNIT_BUDGET: ${{ github.event.inputs.unitBudget || '9000' }}
          ONLY_SEEDS: ${{ github.event.inputs.onlySeeds }}
        run: |
          if [ "${{ github.event.inputs.lensTest }}" = "true" ]; then
            node tools/lens-test.mjs
          else
            node src/index.js \
              ${{ github.event.inputs.checkRemote == 'true' && '--check-remote' || '' }} \
              ${{ github.event.inputs.metricsOnly == 'true' && '--metrics-only' || '' }}
          fi

      # Сохраняем даже если прогон упал. Оркестратор пишет базу в finally,
      # так что на диске лежит всё собранное до падения. Раньше падение на
      # одном мёртвом канале выбрасывало четыре тысячи потраченных юнитов
      # и целый день сбора вместе с ними.
      - name: Убрать базу на хранение
        if: always() && github.event.inputs.checkRemote != 'true' && github.event.inputs.lensTest != 'true'
        uses: actions/cache/save@v4
        with:
          path: data
          key: niche-db-${{ github.run_id }}

      # Кэш GitHub выселяет по давности и по объёму — это не хранилище, а
      # ускоритель. Отдельная копия артефактом даёт откуда восстановиться,
      # если кэш пропадёт: скачивается со страницы прогона руками.
      - name: Запасная копия базы
        if: always() && github.event.inputs.checkRemote != 'true' && github.event.inputs.lensTest != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: niche-db-${{ github.run_id }}
          path: data
          retention-days: 14
          compression-level: 0

      # В репозиторий уезжает только то, что человек читает: страница,
      # отчёты и config/seeds.json, куда автопоиск дописывает найденные темы.
      # Данные сюда больше не попадают — они в .gitignore.
      # Стоп, а не обещание.
      #
      # Аккаунт заблокировали за то, что в репозиторий каждую ночь уезжали
      # сотни мегабайт. Тогда это выглядело безобидно — файл просто рос.
      # Поэтому здесь стоит жёсткий порог: если коммит вдруг потяжелел,
      # прогон падает и никуда ничего не пушит. Разбираться будем на берегу,
      # а не после второй блокировки.
      #
      # Норма сегодня — около мегабайта: страница 0,5 МБ плюс отчёты. Порог
      # в пять даёт запас вчетверо и всё равно ловит любой возврат данных
      # в git. Если порог сработал — это не повод его поднять, это повод
      # выяснить, что именно распухло.
      - name: Проверка веса коммита
        if: always() && github.event.inputs.checkRemote != 'true' && github.event.inputs.lensTest != 'true'
        run: |
          git add -A reports docs config index.html
          if git diff --staged --name-only | grep -q '^data/'; then
            echo "::error::В коммит попал data/ — база не должна уезжать в git"
            exit 1
          fi
          BYTES=$(git diff --staged --name-only -z \
            | xargs -0 -r -I{} stat -c%s {} 2>/dev/null \
            | awk '{s+=$1} END {print s+0}')
          echo "Вес изменённых файлов: $((BYTES / 1024)) КБ"
          if [ "$BYTES" -gt 5242880 ]; then
            echo "::error::Коммит весит $((BYTES / 1048576)) МБ при пороге 5 МБ."
            echo "::error::Так начиналась блокировка. Выясните, что распухло, прежде чем поднимать порог."
            git diff --staged --name-only | while read -r f; do
              [ -f "$f" ] && echo "  $(du -h "$f" | cut -f1)  $f"
            done
            exit 1
          fi

      - name: Коммит страницы и отчётов
        if: always() && github.event.inputs.checkRemote != 'true' && github.event.inputs.lensTest != 'true'
        run: |
          git config user.name "niche-finder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --staged --quiet; then
            echo "Страница не изменилась — коммитить нечего"
          else
            git commit -m "Сбор за $(date -u +%F)${{ steps.run.outcome == 'failure' && ' (прогон упал, сохранено собранное)' || '' }}"
            git push
          fi
