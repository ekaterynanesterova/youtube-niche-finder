name: Сбор данных

on:
  workflow_dispatch:
    inputs:
      searchBudget:
        description: 'Сколько search-запросов сделать (0 = только опрос известных каналов, без разведки)'
        default: '40'
      unitBudget:
        description: 'Потолок квоты на прогон (из 10000 в сутки)'
        default: '9000'
      onlySeeds:
        description: 'Прогнать только эти темы, через запятую (пусто = обычная ротация)'
        default: ''
      metricsOnly:
        description: 'Только пересчитать метрики и пересобрать страницу, без похода в YouTube'
        type: boolean
        default: false
  # РАСПИСАНИЕ ВЫКЛЮЧЕНО 15 сентября 2026, пока аккаунт на проверке у GitHub.
  #
  # Каждый ночной прогон дописывал в историю репозитория новый снимок
  # data/videos.json целиком — 82,5 МБ, плюс current.json на 6,8 и свежий
  # срез на 3,7. Около ста мегабайт новых объектов в сутки, коммитом от
  # бота, по расписанию. Со стороны GitHub это неотличимо от того, что их
  # автоматика и должна ловить: репозиторий в роли базы данных, а Actions
  # в роли сборщика данных, а не сборки проекта.
  #
  # Включать обратно только после того, как накопленная база переедет из
  # git наружу. Ручной запуск (workflow_dispatch) выше остался: он не ходит
  # по расписанию и запускается осознанно.
  #
  # schedule:
  #   # 07:30 UTC — через полчаса после летнего обнуления квоты Google.
  #   - cron: '30 7 * * *'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Проверка счётной части
        run: node src/selftest.js

      - name: Прогон
        id: run
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SEARCH_BUDGET: ${{ github.event.inputs.searchBudget || '40' }}
          UNIT_BUDGET: ${{ github.event.inputs.unitBudget || '9000' }}
          ONLY_SEEDS: ${{ github.event.inputs.onlySeeds }}
        run: node src/index.js ${{ github.event.inputs.metricsOnly == 'true' && '--metrics-only' || '' }}

      # Коммитим даже если прогон упал. Оркестратор сохраняет базу в finally,
      # так что на диске лежит всё собранное до падения. Раньше падение на
      # одном мёртвом канале выбрасывало четыре тысячи потраченных юнитов
      # и целый день сбора вместе с ними.
      - name: Коммит результата
        if: always()
        run: |
          git config user.name "niche-finder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # config — там seeds.json, куда автопоиск дописывает найденные темы.
          # Без него каждая ночная находка исчезала вместе с контейнером.
          # docs — бриф, который забирают в другой чат по ссылке.
          git add -A data reports docs config index.html
          if git diff --staged --quiet; then
            echo "Данные не изменились — коммитить нечего"
          else
            git commit -m "Сбор за $(date -u +%F)${{ steps.run.outcome == 'failure' && ' (прогон упал, сохранено собранное)' || '' }}"
            git push
          fi
